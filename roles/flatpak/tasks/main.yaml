---
# tasks file for flatpak

- name: Install Flatpak
  community.general.pacman:
    name: flatpak
    state: latest

- name: Add Flathub repository
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
    enabled: true

- name: Update Flatpak appstream metadata
  ansible.builtin.command:
    cmd: flatpak update --appstream
  changed_when: false

- name: Copy flatpak-manager systemd service and timer files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - flatpak-manager.service
    - flatpak-manager.timer
  notify: Reload systemd daemon

- name: Start and enable flatpak-manager service
  ansible.builtin.service:
    name: flatpak-manager.service
    state: started
    enabled: true
