---
# tasks file for brave

- name: Install brave
  kewlfft.aur.aur:
    name: brave-bin
    use: paru
    state: "{{ brave_state }}"
  become: true
  become_user: aur_builder

- name: Configure brave
  when: brave_state == 'latest'
  block:
    - name: Ensure managed policies directory exists
      ansible.builtin.file:
        path: "{{ brave_managed_policies_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy managed policies.json file
      ansible.builtin.template:
        src: managed_policies.json.j2
        dest: "{{ brave_managed_policies_dir }}/managed_policies.json"
        owner: root
        group: root
        mode: "0644"

- name: Ensure removed
  ansible.builtin.file:
    path: "{{ brave_managed_policies_dir }}"
    state: absent
  when: brave_state == 'absent'
